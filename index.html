<style>
  :root{
    --bg:#0A1120; --panel:#101a30; --panel2:#0D1526; --border:#1c2843; --border2:#233151;
    --text:#e7ecf5; --muted:#94a3b8; --muted2:#64748b;
    --amber:#fbbf24; --amber-soft:rgba(251,191,36,.1); --amber-bd:rgba(251,191,36,.3);
    --emerald:#34d399; --emerald-soft:rgba(52,211,153,.1); --emerald-bd:rgba(52,211,153,.3);
    --rose:#fb7185; --rose-soft:rgba(251,113,133,.1); --rose-bd:rgba(251,113,133,.3);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;}
  #root{min-height:100vh;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  a{color:inherit;}

  /* Splash */
  .splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999;transition:opacity .4s ease;}
  .splash.fade{opacity:0;pointer-events:none;}
  .splash-icon{width:64px;height:64px;border-radius:16px;background:var(--amber);display:flex;align-items:center;justify-content:center;color:var(--bg);font-weight:800;font-size:22px;box-shadow:0 0 0 1px var(--border), 0 20px 50px rgba(251,191,36,.15);animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
  .splash-name{font-size:14px;color:var(--muted);letter-spacing:.04em;}
  .spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--border2);border-top-color:var(--amber);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Layout */
  .app{min-height:100vh;display:flex;}
  .sidebar{width:256px;flex-shrink:0;background:#0C1424;border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:10px;padding:10px 8px 14px;}
  .brand-icon{width:36px;height:36px;border-radius:10px;background:var(--amber);display:flex;align-items:center;justify-content:center;color:var(--bg);font-weight:800;font-size:13px;flex-shrink:0;}
  .brand-name{font-size:14px;font-weight:700;color:#fcd34d;line-height:1.2;}
  .brand-sub{font-size:10px;color:var(--muted2);margin-top:2px;}
  .nav{flex:1;overflow-y:auto;}
  .nav-group{margin-bottom:18px;}
  .nav-title{font-size:10px;letter-spacing:.08em;color:#475569;padding:0 10px;margin-bottom:6px;}
  .nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--muted);background:transparent;border:1px solid transparent;text-align:left;}
  .nav-item:hover{color:#e2e8f0;background:#121c33;}
  .nav-item.active{color:#fcd34d;background:var(--amber-soft);border-color:var(--amber-bd);}
  .sidebar-footer{font-size:10px;color:#475569;padding:10px 8px 0;border-top:1px solid var(--border);margin-top:10px;display:flex;justify-content:space-between;}
  .main{flex:1;padding:24px;overflow-y:auto;max-height:100vh;}
  @media (max-width:820px){.sidebar{position:fixed;left:-260px;transition:left .2s;height:100vh;z-index:50;}.sidebar.open{left:0;}.menu-btn{display:inline-flex !important;}}
  .menu-btn{display:none;}

  /* Generic */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;}
  .h1{font-size:22px;font-weight:600;color:#f1f5f9;margin:0;}
  .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fcd34d;opacity:.85;margin-bottom:4px;}
  .row{display:flex;align-items:center;}
  .between{justify-content:space-between;}
  .gap-2{gap:8px;} .gap-3{gap:12px;} .wrap{flex-wrap:wrap;}
  .grid{display:grid;gap:14px;}
  .grid-2{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(3,1fr);} .grid-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:820px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
  @media (max-width:520px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

  .btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:9px 15px;border-radius:10px;border:1px solid transparent;background:var(--amber);color:var(--bg);}
  .btn:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-ghost{background:var(--panel);border:1px solid var(--border);color:#cbd5e1;font-weight:500;}
  .btn-ghost:hover{border-color:var(--amber-bd);color:#fcd34d;}
  .btn-icon{background:transparent;border:none;color:#64748b;padding:4px;border-radius:6px;}
  .btn-icon:hover{color:#fb7185;}

  .input,.select{width:100%;background:var(--panel2);border:1px solid var(--border2);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--text);outline:none;}
  .input::placeholder{color:#475569;}
  .input:focus,.select:focus{border-color:rgba(251,191,36,.5);}
  .label{font-size:11px;color:var(--muted2);display:block;margin-bottom:4px;}

  .badge{font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid var(--border2);color:var(--muted);}
  .badge-ok{background:var(--emerald-soft);border-color:var(--emerald-bd);color:#6ee7b7;}
  .badge-warn{background:var(--rose-soft);border-color:var(--rose-bd);color:#fda4af;}
  .badge-dot{width:6px;height:6px;border-radius:50%;background:var(--emerald);display:inline-block;margin-right:5px;}

  .alert{cursor:pointer;background:var(--rose-soft);border:1px solid var(--rose-bd);border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .alert-text{font-size:13px;color:#ffe4e6;}

  .stat{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;flex:1;min-width:150px;}
  .stat-label{font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px;}
  .stat-value{font-size:22px;font-weight:600;color:#f1f5f9;}
  .stat-sub{font-size:11px;color:var(--muted2);margin-top:4px;}

  .rate-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;flex:1;min-width:130px;}
  .rate-label{font-size:11px;color:var(--muted2);margin-bottom:2px;}
  .rate-value{font-size:17px;font-weight:600;color:#f1f5f9;}
  .rate-change{font-size:11px;margin-top:2px;}
  .up{color:#34d399;} .down{color:#fb7185;}
  .blurred{filter:blur(4px);user-select:none;}

  .list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:8px;}
  .list-row:hover{border-color:#2c3d63;}
  .list-empty{color:var(--muted2);font-size:13px;padding:32px;text-align:center;border:1px dashed var(--border2);border-radius:12px;}

  .toggle-pill{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--border2);color:var(--muted);background:transparent;}
  .toggle-pill.on{border-color:var(--emerald-bd);color:#6ee7b7;background:var(--emerald-soft);}

  .bar-track{height:10px;background:var(--panel2);border-radius:999px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--amber);}

  .section-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .section-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
  .section-title{font-size:17px;font-weight:600;color:#f1f5f9;}
  .count-pill{font-size:11px;color:var(--muted2);background:var(--panel);border:1px solid var(--border);padding:2px 9px;border-radius:999px;}

  .edit-panel{background:var(--panel2);border:1px solid var(--amber-bd);border-radius:14px;padding:14px;margin-bottom:14px;}
  .health-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:8px;}
  .health-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

  .chat-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;height:60vh;overflow:hidden;}
  .calc-layout{display:flex;gap:16px;align-items:flex-start;}
  .calc-list{width:250px;flex-shrink:0;}
  @media (max-width:820px){.calc-layout{flex-direction:column;}.calc-list{width:100%;}}
  .chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:80%;border-radius:12px;padding:9px 13px;font-size:13px;line-height:1.5;}
  .msg.user{align-self:flex-end;background:var(--amber-soft);border:1px solid var(--amber-bd);color:#fde68a;}
  .msg.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--border2);color:#e2e8f0;}
  .disclaimer{font-size:11px;color:var(--muted2);padding:8px 14px;border-bottom:1px solid var(--border);background:rgba(251,191,36,.04);}
</style>
</head>

async function fetchLiveRates(prevRates) {
  const [usdRes, eurRes, goldRes] = await Promise.all([fetch("https://api.frankfurter.dev/v1/latest?from=USD&to=TRY").then(r => r.json()), fetch("https://api.frankfurter.dev/v1/latest?from=EUR&to=TRY").then(r => r.json()), fetch("https://api.gold-api.com/price/XAU").then(r => r.json())]);
  const usd = usdRes.rates.TRY;
  const eur = eurRes.rates.TRY;
  const goldOns = goldRes.price;
  const goldGram = goldOns / 31.1035 * usd;
  const ataAltin = goldGram * 7.216;
  const pct = (n, o) => o ? Number(((n - o) / o * 100).toFixed(2)) : 0;
  return {
    usd,
    usdChange: pct(usd, prevRates.usd),
    eur,
    eurChange: pct(eur, prevRates.eur),
    goldOns,
    goldOnsChange: pct(goldOns, prevRates.goldOns),
    goldGram,
    goldGramChange: pct(goldGram, prevRates.goldGram),
    ataAltin,
    ataAltinChange: pct(ataAltin, prevRates.ataAltin),
    updatedAt: new Date().toISOString()
  };
}

// ===== MARKET NEWS (TAVILY SEARCH) =====
const MarketNews = ({ appData, persist }) => {
  const [news, setNews] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [region, setRegion] = React.useState('Tekirdağ');

  const searchMarket = async () => {
    setLoading(true);
    try {
      const stored = await window.storage?.get('tavilyApiKey');
      if (!stored?.value) {
        alert('Tavily API anahtarı ayarla (Settings)');
        setLoading(false);
        return;
      }
      const query = `emlak piyasası "${region}" ${new Date().getFullYear()}`;
      const resp = await fetch('https://api.tavily.com/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          api_key: stored.value,
          query: query,
          max_results: 15,
          days: 7
        })
      });
      const data = await resp.json();
      const newsItems = (data.results || []).map((r, i) => ({
        id: uid(),
        date: new Date().toISOString().slice(0, 10),
        title: r.title,
        source: r.source || 'Bilinmiyor',
        url: r.url,
        summary: (r.snippet || r.title).slice(0, 200),
        region: region,
        relevance: i < 5 ? 'high' : i < 10 ? 'medium' : 'low'
      }));
      setNews(newsItems);
      persist({ ...appData, marketNews: newsItems });
    } catch (e) {
      alert('Hata: ' + e.message);
    } finally {
      setLoading(false);
    }
  };

  return React.createElement('div', null,
    React.createElement('div', { style: { marginBottom: 16, padding: 14, background: '#0A1120', borderRadius: 8 } },
      React.createElement('div', { style: { fontSize: 14, fontWeight: 600, color: '#e2e8f0', marginBottom: 12 } }, '🔍 Piyasa Haberleri'),
      React.createElement('input', { type: 'text', value: region, onChange: (e) => setRegion(e.target.value), placeholder: 'Tekirdağ, İstanbul...', style: { width: '100%', padding: '8px', background: '#0f172a', border: '1px solid #334155', borderRadius: 4, color: '#e2e8f0', marginBottom: 10, fontSize: 11 } }),
      React.createElement('button', { onClick: searchMarket, disabled: loading, style: { width: '100%', padding: '8px', background: '#0f766e', color: 'white', border: 'none', borderRadius: 4, fontWeight: 600, cursor: 'pointer' } }, loading ? '⟳ Aranıyor...' : '🔍 Haberleri Ara')
    ),
    news.map(article => React.createElement('div', { key: article.id, style: { marginBottom: 12, padding: 12, background: '#0A1120', borderRadius: 8, borderLeft: '3px solid #0f766e' } },
      React.createElement('a', { href: article.url, target: '_blank', rel: 'noopener noreferrer', style: { fontSize: 12, fontWeight: 600, color: '#0f766e', textDecoration: 'none' } }, article.title),
      React.createElement('div', { style: { fontSize: 9, color: '#64748b', marginTop: 4, marginBottom: 6 } }, article.source + ' • ' + article.date),
      React.createElement('p', { style: { fontSize: 11, color: '#cbd5e1', margin: 0, lineHeight: 1.4 } }, article.summary + '...')
    ))
  );
};

// Tavily API Key Setting Component
const TavilySettings = ({ appData, persist }) => {
  const [tavilyKey, setTavilyKey] = React.useState('');

  React.useEffect(() => {
    (async () => {
      const stored = await window.storage?.get('tavilyApiKey');
      if (stored?.value) setTavilyKey('***HIDDEN***');
    })();
  }, []);

  const saveTavilyKey = async () => {
    if (!tavilyKey || tavilyKey === '***HIDDEN***') {
      alert('Tavily API anahtarını gir');
      return;
    }
    await window.storage?.set('tavilyApiKey', tavilyKey);
    alert('✓ Tavily API anahtarı kaydedildi');
    setTavilyKey('***HIDDEN***');
  };

  return React.createElement('div', { style: { marginTop: 16, padding: 12, background: '#0A1120', borderRadius: 8 } },
    React.createElement('div', { style: { fontSize: 12, fontWeight: 600, color: '#e2e8f0', marginBottom: 10 } }, '🔍 Tavily (Piyasa Haberleri)'),
    React.createElement('input', { type: 'password', placeholder: 'tvly-...', value: tavilyKey, onChange: (e) => setTavilyKey(e.target.value), style: { width: '100%', padding: '8px', background: '#0f172a', border: '1px solid #334155', borderRadius: 4, color: '#e2e8f0', marginBottom: 10, fontSize: 11 } }),
    React.createElement('button', { onClick: saveTavilyKey, style: { width: '100%', padding: '8px', background: '#0f766e', color: 'white', border: 'none', borderRadius: 4, fontWeight: 600, cursor: 'pointer', marginBottom: 10 } }, '✓ Kaydet'),
    React.createElement('div', { style: { fontSize: 9, color: '#64748b', lineHeight: 1.4 } }, 
      'Tavily API anahtarını ',
      React.createElement('a', { href: 'https://api.tavily.com', target: '_blank', style: { color: '#0f766e' } }, 'api.tavily.com'),
      ' adresinden al (500 call/ay ücretsiz)'
    )
  );
};
