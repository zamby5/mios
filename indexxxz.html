<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murat İyicioğlu Gayrimenkul</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #2d4563; color: #f1f5f9; }
.container { max-width: 1200px; margin: 0 auto; padding: 16px; }
.header { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; background: #3a5578; padding: 16px; border-radius: 8px; }
.logo { width: 48px; height: 48px; background: #FBBF24; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 28px; }
.title { font-size: 22px; font-weight: 600; }
.subtitle { font-size: 12px; color: #b8c5d6; }
.nav { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-bottom: 20px; }
.nav-btn { padding: 10px 12px; background: #3a5578; border: 1px solid #52677f; border-radius: 6px; color: #f1f5f9; cursor: pointer; font-size: 11px; font-weight: 500; }
.nav-btn:hover { background: #4a6588; }
.nav-btn.active { background: #00a896; color: white; }
.content { background: #3a5578; border-radius: 8px; padding: 20px; }
.section { margin-bottom: 24px; }
.section-title { font-size: 14px; font-weight: 600; color: #f1f5f9; margin-bottom: 12px; border-bottom: 2px solid #52677f; padding-bottom: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 11px; }
th, td { padding: 10px; text-align: left; border-bottom: 1px solid #52677f; }
th { background: #1e2f45; font-weight: 600; }
tr:hover { background: #1e2f45; }
input, button, textarea, select { padding: 8px; background: #1e2f45; border: 1px solid #52677f; border-radius: 4px; color: #f1f5f9; font-size: 11px; font-family: inherit; }
input::placeholder { color: #b8c5d6; }
button { cursor: pointer; background: #00a896; color: white; border: none; font-weight: 600; }
button:hover { background: #008870; }
button:disabled { background: #666; cursor: not-allowed; }
.widget { background: #1e2f45; padding: 12px; border-radius: 6px; margin-bottom: 12px; border-left: 3px solid #00a896; }
textarea { width: 100%; padding: 10px; background: #1e2f45; border: 1px solid #52677f; border-radius: 4px; color: #f1f5f9; font-family: inherit; resize: vertical; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">🏠</div>
    <div>
      <div class="title">Murat İyicioğlu</div>
      <div class="subtitle">Gayrimenkul Paneli</div>
    </div>
  </div>

  <div class="nav" id="nav"></div>
  <div class="content" id="content"></div>
</div>

<script>
// Simple state management (no React needed)
const STORAGE_KEY = 'muratGayrimenkulData';
const DEFAULT_DATA = {
  tasks: [], appointments: [], income: [], expenses: [], bankAssets: [],
  portfolio: [], siteData: [], contacts: [], documents: [],
  voiceNotes: []
};

let appData = { ...DEFAULT_DATA };
let currentPage = 'dashboard';

// Load data
function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) appData = JSON.parse(saved);
  } catch (e) {
    console.error('Load error:', e);
  }
}

// Save data
function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
  } catch (e) {
    console.error('Save error:', e);
  }
}

// Navigation
const pages = [
  { group: 'GENEL', page: 'dashboard', label: 'Dashboard' },
  { group: 'GENEL', page: 'tasks', label: 'Görevler' },
  { group: 'GENEL', page: 'appointments', label: 'Randevular' },
  { group: 'FİNANS', page: 'income', label: 'Gelir' },
  { group: 'FİNANS', page: 'expenses', label: 'Gider' },
  { group: 'FİNANS', page: 'bankAssets', label: 'Banka' },
  { group: 'PORTFÖY', page: 'portfolio', label: 'Portföy' },
  { group: 'PORTFÖY', page: 'siteData', label: 'Site' },
  { group: 'VERİ', page: 'contacts', label: 'Müşteri' },
  { group: 'VERİ', page: 'documents', label: 'Evraklar' },
  { group: 'VERİ', page: 'voice', label: '🎤 Ses Kayıt' },
];

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = pages.map(p => `
    <button class="nav-btn ${currentPage === p.page ? 'active' : ''}" 
            onclick="navigate('${p.page}')">
      ${p.label}
    </button>
  `).join('');
}

function navigate(page) {
  currentPage = page;
  renderNav();
  renderContent();
}

// CRUD helper
function crudSection(title, section) {
  const items = appData[section] || [];
  const html = `
    <div class="section">
      <div class="section-title">${title}</div>
      <div style="margin-bottom: 12px; display: flex; gap: 8px;">
        <input type="text" id="input-${section}" placeholder="Ekle..." 
               onkeypress="if(event.key==='Enter') addItem('${section}')">
        <button onclick="addItem('${section}')">+ Ekle</button>
      </div>
      ${items.length === 0 ? '<div style="color: #b8c5d6; font-size: 11px;">Henüz kayıt yok</div>' : `
        <table>
          <tbody>
            ${items.map((item, i) => `
              <tr>
                <td>${item.title || item}</td>
                <td style="text-align: right; width: 60px;">
                  <button onclick="removeItem('${section}', ${i})" 
                          style="background: #ef4444; padding: 6px 10px; font-size: 10px;">Sil</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `}
    </div>
  `;
  document.getElementById('content').innerHTML = html;
}

function addItem(section) {
  const input = document.getElementById(`input-${section}`);
  const value = input.value.trim();
  if (value) {
    if (!appData[section]) appData[section] = [];
    appData[section].push({ title: value });
    saveData();
    input.value = '';
    crudSection(pages.find(p => p.page === section)?.label || section, section);
  }
}

function removeItem(section, index) {
  if (appData[section]) {
    appData[section].splice(index, 1);
    saveData();
    crudSection(pages.find(p => p.page === section)?.label || section, section);
  }
}

// Dashboard
function renderDashboard() {
  const html = `
    <div>
      <div class="widget">
        <div style="font-size: 12px; font-weight: 600; margin-bottom: 8px;">🔑 Groq API</div>
        <input type="password" placeholder="gsk-..." id="groq-key" style="width: 100%; margin-bottom: 8px;">
        <button onclick="saveGroq()" style="width: 100%;">Kaydet</button>
      </div>

      <div class="widget">
        <div style="font-size: 12px; font-weight: 600; margin-bottom: 8px;">🔍 Tavily API</div>
        <input type="password" placeholder="tvly-..." id="tavily-key" style="width: 100%; margin-bottom: 8px;">
        <button onclick="saveTavily()" style="width: 100%;">Kaydet</button>
      </div>

      <div class="widget">
        <div style="font-size: 14px; font-weight: 600;">📊 Özet</div>
        <div style="margin-top: 10px;">
          <div>✓ Görevler: ${appData.tasks.length}</div>
          <div>✓ Randevular: ${appData.appointments.length}</div>
          <div>✓ Gelir: ${appData.income.length}</div>
          <div>✓ Portföy: ${appData.portfolio.length}</div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
}

function saveGroq() {
  const key = document.getElementById('groq-key').value;
  if (key) {
    localStorage.setItem('groqApiKey', key);
    alert('✓ Kaydedildi');
    document.getElementById('groq-key').value = '';
  }
}

function saveTavily() {
  const key = document.getElementById('tavily-key').value;
  if (key) {
    localStorage.setItem('tavilyApiKey', key);
    alert('✓ Kaydedildi');
    document.getElementById('tavily-key').value = '';
  }
}

// Voice Recorder
function renderVoiceRecorder() {
  const html = `
    <div>
      <div class="section">
        <div class="section-title">🎤 Ses Kaydı</div>
        <textarea id="transcript" placeholder="Kayıtlı metin burada görünecek..." style="height: 80px; margin-bottom: 10px;"></textarea>
        <div style="display: flex; gap: 8px;">
          <button id="record-btn" onclick="startRecording()" style="flex: 1;">🎤 Kayıt Başlat</button>
          <button onclick="saveVoiceNote()" style="flex: 1;">💾 Kaydet</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">📝 Notlar</div>
        <div id="voice-notes-list"></div>
      </div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
  loadVoiceNotes();
}

function startRecording() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert('Tarayıcı desteklemiyor. Chrome, Edge veya Safari kullan.');
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = 'tr-TR';
  recognition.continuous = true;
  const btn = document.getElementById('record-btn');
  const textarea = document.getElementById('transcript');
  
  recognition.onstart = () => {
    btn.textContent = '⏹️ Kaydediliyor...';
    btn.disabled = true;
  };

  recognition.onresult = (e) => {
    let text = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      text += e.results[i][0].transcript + ' ';
    }
    textarea.value += text;
  };

  recognition.onend = () => {
    btn.textContent = '🎤 Kayıt Başlat';
    btn.disabled = false;
  };

  recognition.start();
}

function saveVoiceNote() {
  const textarea = document.getElementById('transcript');
  const text = textarea.value.trim();
  if (text) {
    if (!appData.voiceNotes) appData.voiceNotes = [];
    appData.voiceNotes.push({
      id: Date.now(),
      text: text,
      date: new Date().toLocaleString('tr-TR'),
      type: 'voice'
    });
    saveData();
    textarea.value = '';
    alert('✓ Not kaydedildi');
    loadVoiceNotes();
  }
}

function loadVoiceNotes() {
  const list = document.getElementById('voice-notes-list');
  const notes = appData.voiceNotes || [];
  
  if (notes.length === 0) {
    list.innerHTML = '<div style="color: #b8c5d6; font-size: 11px;">Henüz not yok</div>';
    return;
  }

  list.innerHTML = `
    <table>
      <tbody>
        ${notes.map((note, i) => `
          <tr>
            <td>
              <div style="font-weight: 600; font-size: 11px;">${note.date}</div>
              <div style="font-size: 10px; color: #b8c5d6; margin-top: 4px;">${note.text.substring(0, 50)}...</div>
            </td>
            <td style="text-align: right; width: 60px;">
              <button onclick="deleteVoiceNote(${i})" style="background: #ef4444; padding: 6px 10px; font-size: 10px;">Sil</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function deleteVoiceNote(index) {
  appData.voiceNotes.splice(index, 1);
  saveData();
  loadVoiceNotes();
}

// Render content
function renderContent() {
  switch (currentPage) {
    case 'dashboard': renderDashboard(); break;
    case 'voice': renderVoiceRecorder(); break;
    case 'tasks': crudSection('Görevler', 'tasks'); break;
    case 'appointments': crudSection('Randevular', 'appointments'); break;
    case 'income': crudSection('Gelir', 'income'); break;
    case 'expenses': crudSection('Gider', 'expenses'); break;
    case 'bankAssets': crudSection('Banka Varlıkları', 'bankAssets'); break;
    case 'portfolio': crudSection('Portföy', 'portfolio'); break;
    case 'siteData': crudSection('Site Verileri', 'siteData'); break;
    case 'contacts': crudSection('Müşteri & Danışman', 'contacts'); break;
    case 'documents': crudSection('Evraklar', 'documents'); break;
    default: renderDashboard();
  }
}

// Initialize
loadData();
renderNav();
renderContent();
</script>
</body>
</html>
